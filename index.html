<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web GIS - GeoServer & LeafletJS</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- jQuery (dibutuhkan oleh L.Geoserver.js) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Plugin Leaflet GeoServer -->
    <script src="lib/L.Geoserver.js"></script>

    <script>
        var map = L.map("map").setView([-8.3500, 123.0000], 10);

        // 2. Basemap OpenStreetMap
        var osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        });
        osm.addTo(map);

        // 3. Layer WMS 1: Batas Administrasi Desa (GeoServer Lokal)
        var wmsLayer1 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:batas_kecamatan",
            transparent: true,
        });
        wmsLayer1.addTo(map);

        // 4. Layer WMS 2: Jalan Kabupaten Sleman (Geoportal Sleman)
        var wmsLayer2 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:jalan",
            transparent: true,
        });
        wmsLayer2.addTo(map);

        // 5. Layer WMS 3: Penduduk Sleman (SQL View MySQL di GeoServer Lokal)
        var wmsLayer3 = L.Geoserver.wms("http://localhost:8080/geoserver/wms", {
            layers: "pgweb:toponimi",
            transparent: true,
        });
        wmsLayer3.addTo(map);
        // 6. Legenda Semua Layer di Pojok Kiri Bawah
        var legend = L.control({ position: "bottomleft" });
        legend.onAdd = function () {
            var div = L.DomUtil.create("div", "info legend");
            div.style.background = "white";
            div.style.padding = "10px 12px";
            div.style.borderRadius = "5px";
            div.style.boxShadow = "0 0 10px rgba(0,0,0,0.2)";
            div.style.maxHeight = "250px"; // Batas tinggi kotak legenda
            div.style.overflowY = "auto";  // Muncul scrollbar otomatis

            // Mencegah peta ikut zoom saat kotak legenda di-scroll
            L.DomEvent.disableScrollPropagation(div);

            var baseUrl = "http://localhost:8080/geoserver/wms?REQUEST=GetLegendGraphic&VERSION=1.0.0&FORMAT=image/png&WIDTH=15&HEIGHT=15&LEGEND_OPTIONS=fontSize:11&LAYER=";

            div.innerHTML =
                "<b>Batas Kecamatan</b><br>" +
                '<img src="' + baseUrl + 'pgweb:batas_kecamatan" alt="Legenda Kecamatan"><br><br>' +
                "<b>Jalan</b><br>" +
                '<img src="' + baseUrl + 'pgweb:jalan" alt="Legenda Jalan"><br><br>' +
                "<b>Toponimi</b><br>" +
                '<img src="' + baseUrl + 'pgweb:toponimi" alt="Legenda Toponimi">';

            return div;
        };
        legend.addTo(map);
        legend.addTo(map);

        // 7. Kontrol Layer (Pojok Kanan Atas)
        var baseMaps = {
            "OpenStreetMap": osm
        };

        var overlayMaps = {
            "Batas Administrasi Kecamatan": wmsLayer1,
            "Jalan": wmsLayer2,
            "Toponimi": wmsLayer3
        };

        var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);
    </script>
</body>

</html>
